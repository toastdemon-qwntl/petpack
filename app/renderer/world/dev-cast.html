<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>petpack · pixel cast</title>
  <link rel="icon" href="data:,">
  <script type="importmap">{ "imports": {
    "three": "../../../node_modules/three/build/three.module.js",
    "three/addons/": "../../../node_modules/three/examples/jsm/" } }</script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { overflow: hidden; background: #f3f1e8; color: #384c45; font: 500 13px/1.4 system-ui, -apple-system, sans-serif; }
    header { position: absolute; top: 36px; left: 42px; }
    .eyebrow { text-transform: uppercase; letter-spacing: 3px; font-size: 11px; color: #7a8475; }
    h1 { margin: 17px 0; font-size: clamp(28px, 3.8vw, 52px); line-height: 1.06; font-weight: 650; letter-spacing: -2.7px; }
    header p { max-width: 420px; line-height: 1.65; color: #7a8475; }
    .swatches { display: flex; gap: 19px; margin-top: 27px; color: #677c6f; font-size: 11px; }
    .swatches span::before { content: ''; display: inline-block; width: 7px; height: 7px; background: var(--c); margin-right: 7px; box-shadow: 1px 1px 0 #405b5830; }
    #pane { position: absolute; top: 24px; right: 24px; width: 520px; height: 340px; padding: 7px; border-radius: 22px; background: #ffffff5c; border: 1px solid #ffffffbf; backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 18px 55px #42594b25, inset 0 1px 0 #ffffff; }
    #pane canvas { display: block; width: 100%; height: 100%; border-radius: 15px; }
    #sheet { position: absolute; top: 389px; left: 24px; right: 24px; bottom: 22px; overflow: hidden; border: 1px solid #d5ddcc; border-radius: 18px; background: #e3e9d7; }
    #sheet canvas { width: 100%; height: 100%; display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label { position: absolute; text-align: center; transform: translate(-50%, 0); color: #6f8066; font-size: 10px; white-space: nowrap; }
    .label strong { font-weight: 650; color: #435948; margin-right: 5px; }
    .atlas-fixtures .label { font-size: 12px; line-height: 1.65; }
    .atlas-fixtures .label strong { display: block; margin: 0; }
    #error { position: absolute; left: 42px; top: 330px; color: #a54c39; }
    @media (min-width: 1800px) { #sheet { left: 8%; right: 8%; bottom: 4%; } header { left: 8%; } }
    @media (max-width: 900px) { header { display: none; } #pane { right: 50%; transform: translateX(50%); width: min(520px, 94vw); } .label { font-size: 8px; } }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">petpack / the neighbours</div>
    <h1>Small pixels.<br>Big personalities.</h1>
    <p>Four little locals, and room for your Codex pet.<br>Made to wander, meet, and learn together.</p>
    <div class="swatches"><span style="--c:#86b7ae">Pip</span><span style="--c:#d98a54">Miso</span><span style="--c:#86a8ba">Bolt</span><span style="--c:#a4b565">Bud</span></div>
  </header>
  <div id="pane"><canvas aria-label="Pixel pets walking and meeting in a small glass pane"></canvas></div>
  <main id="sheet"><canvas aria-label="Four built-in pets and a Codex-format atlas in every animation state"></canvas><div id="labels"></div></main>
  <div id="error" role="alert"></div>
  <script type="module">
    import * as THREE from 'three'
    import { createStage } from './stage.js'
    import { createPixelPet } from './pixel-pet.js'
    import { createSpritePet } from './sprite-pet.js'
    import { makeTestAtlas, makeAtlasFixtures } from './atlas.js'

    const query = new URLSearchParams(location.search)
    const atlasMode = query.has('atlases')
    if (atlasMode) {
      document.body.classList.add('atlas-fixtures')
      document.querySelector('.eyebrow').textContent = 'petpack / bring your own pet'
      document.querySelector('h1').innerHTML = 'Any scale.<br>The same little friend.'
      document.querySelector('header p').textContent = 'Codex atlases at half, original, double and uneven sizes. Missing or broken artwork gets a local pet in your colour.'
      document.querySelector('.swatches').textContent = 'WebP · PNG · data URLs · blob URLs · sparse animation rows'
      document.querySelector('#sheet canvas').setAttribute('aria-label', 'Eight sprite compatibility fixtures, including two built-in fallbacks')
    }
    const pixelScale = Math.max(1, Math.min(4, Number(query.get('px')) || 2))
    const sheet = document.querySelector('#sheet')
    const pane = document.querySelector('#pane canvas')
    const stage = createStage(sheet.querySelector('canvas'), { pixelScale })
    const closeup = createStage(pane, { pixelScale })
    const floors = []
    for (const s of [stage, closeup]) {
      s.scene.background = new THREE.Color('#e4ead6')
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ color: '#e4ead6' }))
      floor.rotation.x = -Math.PI / 2
      floor.position.y = -.012
      s.scene.add(floor)
      floors.push(floor)
    }
    const kinds = ['blob', 'cat', 'robot', 'sprout', 'codex']
    const colors = ['#86b7ae', '#d98a54', '#86a8ba', '#a4b565', '#e5bb87']
    const names = ['Pip', 'Miso', 'Bolt', 'Bud', 'Codex']
    const poses = ['idle', 'run', 'run', 'wave', 'jump', 'failed', 'waiting', 'review']
    const captions = ['idle', 'right', 'left', 'wave', 'jump', 'slump', 'tap', 'review']
    const characters = [], neighbours = [], labels = []
    const p = new THREE.Vector3()
    let paused = query.has('paused'), time = 0, previous, frameRequest, disposed = false
    let spriteUrl, fixtureSet

    function addCharacter(pet, col, row, fixture) {
      if (fixture) pet.object3d.position.set((col - 1.5) * 5.8, 0, (row - .5) * 6.1)
      else pet.object3d.position.set((col - 3.5) * 3.75, 0, (row - 2) * 4.75)
      const state = { anim: poses[col], facing: col === 2 ? -1 : 1, moving: poses[col] === 'run' ? 1.8 : 0 }
      pet.set(state)
      stage.scene.add(pet.object3d)
      characters.push({ pet, state, kind: fixture?.id ?? kinds[row], col, row, fixture })
      const element = document.createElement('div')
      element.className = 'label'
      const name = document.createElement('strong')
      name.textContent = fixture?.label ?? names[row]
      const caption = fixture ? fixture.width ? `${fixture.width} × ${fixture.height} · ${fixture.urlKind}` : 'safe fallback' : captions[col]
      element.append(name, document.createTextNode(caption))
      document.querySelector('#labels').append(element)
      labels.push({ element, anchor: pet.object3d })
    }

    function resize() {
      const width = sheet.clientWidth, height = sheet.clientHeight
      stage.resize(width, height)
      stage.focus(0, atlasMode ? -.65 : -.45, { span: atlasMode ? Math.max(25, 7.8 * width / height) : Math.max(32, 15.2 * width / height) })
      closeup.resize(pane.clientWidth, pane.clientHeight)
      closeup.focus(0, -1.6, { span: 12 })
    }
    resize()
    const observer = new ResizeObserver(resize)
    observer.observe(sheet); observer.observe(pane)

    function step(dt) {
      time += dt
      for (const { pet } of characters) pet.update(dt, time)
      const phase = time % 16
      for (const [i, pet] of neighbours.entries()) {
        const left = i % 2 === 0, row = Math.floor(i / 2)
        const travel = phase < 5 ? phase / 5 : phase < 10 ? 1 : phase < 15 ? 1 - (phase - 10) / 5 : 0
        const x = (left ? -1 : 1) * (4.3 - travel * 3.1)
        const walking = phase < 5 || (phase >= 10 && phase < 15)
        const facing = (left ? 1 : -1) * (phase < 10 ? 1 : -1)
        pet.object3d.position.set(x, 0, row ? 2.1 : -2.3)
        pet.set({ anim: walking ? 'run' : phase < 7 ? 'wave' : phase < 10 ? 'review' : 'idle', facing, moving: walking ? .62 : 0 })
        pet.update(dt, time)
      }
      stage.update(dt, time); closeup.update(dt, time)
      if (neighbours.length) closeup.focus(Math.sin(time * .24) * .4, -1.6, { span: 12 })
    }
    function render() {
      stage.render(); closeup.render()
      for (const { element, anchor } of labels) {
        p.copy(anchor.position); p.z += .48
        const screen = stage.toScreen(p)
        element.style.left = `${screen.x}px`; element.style.top = `${screen.y}px`
      }
    }
    function draw(now) {
      if (disposed) return
      const dt = previous === undefined ? 1 / 60 : Math.min(.05, (now - previous) / 1000)
      previous = now
      if (!paused) step(dt)
      render()
      frameRequest = requestAnimationFrame(draw)
    }
    function dispose() {
      if (disposed) return
      disposed = true
      cancelAnimationFrame(frameRequest); observer.disconnect()
      for (const { pet } of characters) pet.dispose()
      for (const pet of neighbours) pet.dispose()
      fixtureSet?.dispose()
      for (const floor of floors) { floor.geometry.dispose(); floor.material.dispose() }
      stage.dispose(); closeup.dispose()
    }
    try {
      if (atlasMode) {
        fixtureSet = await makeAtlasFixtures()
        for (const [i, fixture] of fixtureSet.fixtures.entries()) {
          const pet = await createSpritePet(fixture)
          addCharacter(pet, i % 4, Math.floor(i / 4), fixture)
        }
        spriteUrl = fixtureSet.fixtures[1].spriteUrl
      } else {
        spriteUrl = await makeTestAtlas()
        for (let row = 0; row < kinds.length; row++) {
          for (let col = 0; col < poses.length; col++) {
            const pet = row === 4 ? await createSpritePet({ spriteUrl, color: colors[row] }) : createPixelPet({ color: colors[row], kind: kinds[row] })
            addCharacter(pet, col, row)
          }
        }
      }
      for (let i = 0; i < 4; i++) {
        const pet = atlasMode ? await createSpritePet(fixtureSet.fixtures[i]) : createPixelPet({ kind: kinds[i], color: colors[i] })
        closeup.scene.add(pet.object3d); neighbours.push(pet)
      }
      for (let i = 0; i < 120; i++) { stage.update(1 / 60, 0); closeup.update(1 / 60, 0) }
      step(0)
      window.castDemo = {
        characters, neighbours, stage, closeup, renderer: stage.renderer, scene: stage.scene, camera: stage.camera, spriteUrl, fixtures: fixtureSet?.fixtures,
        pause(value = true) { paused = value },
        advance(seconds) { for (let t = 0; t < seconds; t += 1 / 60) step(Math.min(1 / 60, seconds - t)); render() },
        pop() { neighbours.forEach(pet => pet.pop()) },
        render, dispose,
      }
      document.documentElement.dataset.ready = 'true'
      frameRequest = requestAnimationFrame(draw)
    } catch (error) {
      document.querySelector('#error').textContent = error.message
      console.error(error)
      dispose()
    }
    window.addEventListener('pagehide', dispose, { once: true })
  </script>
</body>
</html>
