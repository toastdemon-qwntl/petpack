<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>petpack · cast</title>
  <link rel="icon" href="data:,">
  <script type="importmap">{ "imports": {
    "three": "../../../node_modules/three/build/three.module.js",
    "three/addons/": "../../../node_modules/three/examples/jsm/" } }</script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #f6f8f7; color: #243338; font: 500 13px/1.4 system-ui, -apple-system, sans-serif; }
    header { position: absolute; z-index: 2; top: 0; inset-inline: 0; padding: 30px 38px; display: flex; align-items: center; justify-content: space-between; }
    .wordmark { font-size: 23px; font-weight: 750; letter-spacing: -1.2px; display: flex; align-items: center; gap: 10px; }
    .mark { width: 13px; height: 13px; border-radius: 50%; background: #0a84ff; box-shadow: inset -2px -2px 3px #0062d466, 0 2px 7px #0a84ff25; }
    nav { display: flex; gap: 8px; }
    button { font: inherit; color: #55636b; background: #ffffffb5; border: 1px solid #dce3e3; padding: 9px 15px; border-radius: 99px; cursor: pointer; box-shadow: 0 2px 3px #18333103; }
    button:hover { background: #fff; color: #0a84ff; }
    button:focus-visible { outline: 3px solid #0a84ff66; outline-offset: 2px; }
    #canvas { display: block; width: 100%; height: 100%; }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label { position: absolute; text-align: center; transform: translate(-50%, 0); color: #697780; font-size: 12px; white-space: nowrap; }
    .label strong { display: block; font-size: 13px; color: #35434a; font-weight: 600; margin-bottom: 4px; }
    .label span { opacity: .8; }
    .row-label { position: absolute; left: 38px; font-size: 10px; color: #859294; letter-spacing: 1.7px; text-transform: uppercase; }
    #error { position: absolute; bottom: 30px; left: 38px; color: #d44848; }
    @media (max-width: 700px) { header { padding: 20px; } .row-label { left: 20px; } .label { font-size: 9px; } .label strong { font-size: 10px; } }
  </style>
</head>
<body>
  <header>
    <div class="wordmark"><span class="mark"></span>petpack</div>
    <nav aria-label="Character previews">
      <button id="pop" type="button">Gift pop</button>
      <button id="replay" type="button">Replay</button>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
    </nav>
  </header>
  <canvas id="canvas" aria-label="Eight colourful Dot characters and eight cream sprite pets showing their animation states"></canvas>
  <div id="labels"></div>
  <div id="error" role="alert"></div>
  <script type="module">
    import * as THREE from 'three'
    import { createDot } from './dot.js'
    import { createSpritePet } from './sprite-pet.js'
    import { makeTestAtlas } from './atlas.js'

    const canvas = document.querySelector('#canvas')
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true })
    renderer.setClearColor(0xf6f8f7, 1)
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.08
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap
    const scene = new THREE.Scene()
    scene.fog = new THREE.Fog(0xf6f8f7, 38, 85)
    const camera = new THREE.PerspectiveCamera(24, 1, .1, 100)
    scene.add(new THREE.HemisphereLight('#e7f0ff', '#a9b7a6', 2.1))
    const key = new THREE.DirectionalLight('#ffe2b8', 3.2)
    key.position.set(-6, 15, 9)
    key.castShadow = true
    key.shadow.mapSize.set(2048, 2048)
    Object.assign(key.shadow.camera, { left: -13, right: 13, top: 11, bottom: -11, near: 1, far: 40 })
    key.shadow.bias = -.0003
    key.shadow.normalBias = .035
    key.shadow.radius = 4
    scene.add(key)
    const rim = new THREE.DirectionalLight('#e0f0ff', 1.4)
    rim.position.set(6, 7, -10)
    scene.add(rim)
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(180, 180), new THREE.MeshStandardMaterial({ color: '#f2f5f1', roughness: .95 }))
    floor.rotation.x = -Math.PI / 2
    floor.position.y = -.018
    floor.receiveShadow = true
    scene.add(floor)

    const colors = ['#0A84FF', '#FF375F', '#FF9F0A', '#30D158', '#BF5AF2', '#64D2FF', '#FFD60A', '#5E5CE6']
    const poses = ['idle', 'run', 'run', 'wave', 'jump', 'failed', 'waiting', 'review']
    const names = ['Blue', 'Rosie', 'Mango', 'Clover', 'Lilac', 'Sky', 'Sunny', 'Indigo']
    const captions = ['Idle', 'Run right', 'Run left', 'Wave', 'Jump', 'Failed', 'Waiting', 'Review']
    const characters = []
    const labels = []
    const overlay = document.querySelector('#labels')
    const p = new THREE.Vector3()
    const rowLabels = ['Dot', 'Codex pet'].map(name => {
      const el = document.createElement('div')
      el.className = 'row-label'
      el.textContent = name
      overlay.append(el)
      return el
    })
    function addCharacter(pet, col, row) {
      pet.object3d.position.set((col - 3.5) * 2.35, 0, row === 0 ? -3.25 : 3.25)
      const state = { anim: poses[col], facing: col === 2 ? -1 : 1, moving: poses[col] === 'run' ? 1 : 0 }
      pet.set(state)
      scene.add(pet.object3d)
      characters.push({ pet, state })
      const label = document.createElement('div')
      label.className = 'label'
      const name = document.createElement('strong')
      name.textContent = row === 0 ? names[col] : 'Mochi'
      const caption = document.createElement('span')
      caption.textContent = captions[col]
      label.append(name, caption)
      overlay.append(label)
      labels.push({ element: label, anchor: pet.object3d })
    }
    colors.forEach((color, i) => addCharacter(createDot({ color }), i, 0))

    function resize() {
      const width = innerWidth, height = innerHeight
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2))
      renderer.setSize(width, height, false)
      camera.aspect = width / height
      const distance = Math.max(29, 10.7 / (Math.tan(THREE.MathUtils.degToRad(12)) * camera.aspect))
      camera.position.set(0, distance * Math.sin(.46), distance * Math.cos(.46))
      camera.lookAt(0, .1, 0)
      camera.updateProjectionMatrix()
      camera.updateMatrixWorld()
      for (const [i, label] of rowLabels.entries()) {
        p.set(-8.2, 2.6, i === 0 ? -3.25 : 3.25).project(camera)
        label.style.top = `${(1 - p.y) * height / 2}px`
      }
    }
    resize()
    window.addEventListener('resize', resize)
    let paused = false
    let time = 0
    let previous = performance.now()
    let frameRequest
    function draw(now) {
      const dt = Math.min(.05, (now - previous) / 1000)
      previous = now
      if (!paused) {
        time += dt
        characters.forEach(({ pet }) => pet.update(dt, time))
      }
      renderer.render(scene, camera)
      for (const { element, anchor } of labels) {
        p.copy(anchor.position)
        p.y = -.18
        p.project(camera)
        element.style.left = `${(p.x + 1) * innerWidth / 2}px`
        element.style.top = `${(1 - p.y) * innerHeight / 2}px`
      }
      frameRequest = requestAnimationFrame(draw)
    }
    frameRequest = requestAnimationFrame(draw)
    document.querySelector('#pop').onclick = () => characters.forEach(({ pet }) => pet.pop())
    document.querySelector('#replay').onclick = () => characters.forEach(({ pet, state }) => { pet.set({ anim: 'idle' }); pet.set(state) })
    document.querySelector('#pause').onclick = event => {
      paused = !paused
      event.target.textContent = paused ? 'Play' : 'Pause'
      event.target.setAttribute('aria-pressed', String(paused))
    }
    try {
      const spriteUrl = await makeTestAtlas()
      const pets = await Promise.all(colors.map(color => createSpritePet({ spriteUrl, color })))
      pets.forEach((pet, i) => addCharacter(pet, i, 1))
      // Intentional inspection surface for the isolated character preview.
      window.castDemo = { characters, renderer, scene, camera, spriteUrl, pause(value = true) { paused = value } }
      document.documentElement.dataset.ready = 'true'
    } catch (error) {
      document.querySelector('#error').textContent = error.message
      console.error(error)
    }
    window.addEventListener('pagehide', () => {
      cancelAnimationFrame(frameRequest)
      window.removeEventListener('resize', resize)
      characters.forEach(({ pet }) => pet.dispose())
      floor.geometry.dispose()
      floor.material.dispose()
      key.shadow.dispose()
      renderer.dispose()
    }, { once: true })
  </script>
</body>
</html>
