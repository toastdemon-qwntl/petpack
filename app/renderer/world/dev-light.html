<body><main>
  <header><div><div class="eyebrow">Petpack · light & knowledge garden</div><h1>A village that grows with you.</h1></div><p>Skills become sunflowers. Memories become bells.<br>A little more life, every time we share.</p></header>
  <section class="studies" aria-label="The four gardens through a day"></section>
  <section class="pair" aria-label="One continuous world across two panes"><div class="glass left"><canvas id="left"></canvas></div><div class="glass right"><canvas id="right"></canvas></div></section>
  <div class="caption"><span><strong>Same world. Same hour.</strong> <span id="time-label"></span></span><span>The plants stay where they grew, on every screen.</span></div>
  <footer>One useful exchange, one new bloom. The road stays open.</footer>
</main>
<script type="module">
  import { createStage } from './stage.js'
  import { createMap, CHUNK_W } from './map.js'
  import { createPixelPet } from './pixel-pet.js'
  const params=new URLSearchParams(location.search)
  const fixed=params.has('hour')&&Number.isFinite(Number(params.get('hour'))) ? Number(params.get('hour')) : null
  const pixelScale=Math.max(1,Math.round(Number(params.get('px'))||2))
  const kinds=['skill','memory','technique','resource']
  const garden=Array.from({length:40},(_,seed)=>({kind:kinds[seed%4],seed}))

  function view(canvas,seat,hour,pets=false){

  for(const [seat,hour,label] of [[0,14,'Afternoon · sunwheels'],[1,17.5,'Golden hour · bells'],[2,18.5,'Dusk · bamboo'],[-1,22,'Moonlight · berries']]){
    const card=document.createElement('div'),glass=document.createElement('div'),canvas=document.createElement('canvas')

    const labelElement=document.createElement('div');labelElement.className='study-label';labelElement.textContent=label
    card.append(labelElement);studies.append(card);view(canvas,seat,hour)
  }

  view(document.querySelector('#left'),seat,fixed,true);view(document.querySelector('#right'),seat+1,fixed,true)
  function resize(){
    const large=innerWidth>=1800, available=document.querySelector('main').clientWidth
    for(let i=0;i<views.length;i++){
      const v=views[i],width=i<4?Math.floor((v.canvas.parentElement.parentElement.clientWidth-12)/(pixelScale*4))*pixelScale*4:Math.min(large?780:520,Math.floor((available-16)/2/(pixelScale*4))*pixelScale*4)
      v.canvas.style.width=width+'px';v.canvas.style.height=width*.75+'px';v.stage.resize(width,width*.75)
      const center=v.map.chunkCenter(v.seat);v.stage.focus(center.x,center.z,{span:CHUNK_W})
      for(let j=0;j<24;j++)v.stage.update(.25,time)

    render()
  }
  function render(dt=0){
    for(const v of views){
      v.cast.forEach((p,i)=>{
        const x=i?seat*14+10.9:seat*14-1.8+Math.sin(time*.19)*3
        p.object3d.position.set(x,v.map.ground(x,1.5),1.5)
        p.set({anim:i?'idle':'run',moving:i?0:.57*Math.abs(Math.cos(time*.19)),facing:i?-1:Math.cos(time*.19)>=0?1:-1});p.update(dt,time)
      })
      v.stage.update(dt,time);v.map.update(dt,time);v.stage.render()
    }
    const hour=views[4].stage.timeOfDay
    document.querySelector('#time-label').textContent=`${String(Math.floor(hour)).padStart(2,'0')}:${String(Math.round(hour%1*60)).padStart(2,'0')}`
  }
  let lastBloom=-1
  function tick(now){
    if(disposed)return
    const dt=Math.min(.1,(now-previous)/1000);previous=now
    if(!paused){time+=dt;const bloom=Math.floor(time/5);if(bloom!==lastBloom&&!params.has('bare')){lastBloom=bloom;for(const v of views)v.map.bloom({kind:kinds[bloom%4],seed:'sharing-'+bloom%8})}render(dt)}

  }

</script></body></html>
