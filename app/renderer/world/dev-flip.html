<body><main>
  <header><div><div class="eyebrow">petpack · one shared village</div><h1>Across the table.</h1></div><p>The same place, from opposite sides. Your pet walks away from you and towards your teammate.</p></header>
  <div class="pair">
    <section><div class="petpack-pane" data-dock="right"><div class="world-viewport" id="south"></div></div><div class="labels"><strong>Looking north</strong><span>Pip’s side of the table</span></div></section>
    <section><div class="petpack-pane" data-dock="left"><div class="world-viewport" id="north"></div></div><div class="labels"><strong id="north-label">Looking south</strong><span>Cleo’s side of the table</span></div></section>
  </div>
  <footer><span id="place-label">Workshop · shared skills</span><div class="controls"><select id="landmark" aria-label="Landmark"><option value="0">Workshop</option><option value="1">Library</option><option value="2">Dojo</option><option value="3">Campfire</option></select><button id="flip" aria-pressed="true">Swing to the other side</button></div></footer>
</main>
<script type="module">
  import * as THREE from 'three'
  import { createStage } from './stage.js'
  import { createMap, CHUNK_W } from './map.js'
  import { createPixelPet } from './pixel-pet.js'
  import { createSpritePet } from './sprite-pet.js'
  import { makeTestAtlas } from './atlas.js'
  import { createFx } from './fx.js'

  const params = new URLSearchParams(location.search)
  const pixelScale = Number(params.get('px')) || 2
  let seat = Math.trunc(Number(params.get('seat')) || 0), time = 0, last = performance.now(), frame = 0
  let paused = params.has('paused'), disposed = false, flipped = true
  const views = [], point = new THREE.Vector3(), before = new THREE.Vector3()
  const atlas = await makeTestAtlas()
  for (const [id, flip] of [['south', false], ['north', true]]) {
    const host = document.getElementById(id), canvas = document.createElement('canvas'), overlay = document.createElement('div')
    canvas.className = 'petpack-world-canvas'; overlay.className = 'petpack-fx-overlay'
    Object.assign(overlay.style, { position: 'absolute', inset: '0' }); host.append(canvas, overlay)
    const stage = createStage(canvas, { pixelScale, flip, timeOfDay: params.has('hour') ? Number(params.get('hour')) : 14 })
    const map = createMap(stage.scene, { seed: 77 })
    const fx = createFx({ scene: stage.scene, camera: stage.camera, stage, overlay })
    const cast = [createPixelPet({ color: '#71b6db', kind: 'cat' }), await createSpritePet({ spriteUrl: atlas, color: '#d88c77' })]
    cast.forEach((pet, i) => { stage.scene.add(pet.object3d); fx.attach(i, { anchor: pet.object3d, height: pet.height, color: i ? '#d88c77' : '#71b6db', name: i ? 'Cleo' : 'Pip', isMe: i === +flip }); fx.setSkills(i, i + 2) })
    views.push({ host, canvas, stage, map, fx, cast })
  }
  function pose(i, t) {
    // A gentle circuit within the walkable road shows opposite screen depth
    // and opposite horizontal travel, without walking through architecture.
    const a = t * .65 + i * Math.PI
    return { x: seat * CHUNK_W + Math.sin(a) * 4.5, z: 1.5 + Math.cos(a) * .95 }
  }
  function render(dt = 0) {
    for (const v of views) {
      v.stage.update(dt, time)
      const visibleSeat = Math.round(v.stage.center.x / CHUNK_W)
      v.map.ensure(visibleSeat - 1, visibleSeat + 1)
      v.cast.forEach((pet, i) => {
        const p = pose(i, time), old = pose(i, time - .01)
        pet.object3d.position.set(p.x, v.map.ground(p.x, p.z), p.z)
        point.copy(pet.object3d.position); before.set(old.x, point.y, old.z)
        const dx = v.stage.toScreen(point).x - v.stage.toScreen(before).x
        pet.set({ anim: 'run', facing: dx < 0 ? -1 : 1, moving: Math.hypot(p.x - old.x, p.z - old.z) / .01 })
        pet.update(dt, time)
      })
      v.map.update(dt, time); v.stage.scene.updateMatrixWorld(true); v.fx.update(dt, time); v.stage.render()
    }
  }
  function setSeat(value) {
    seat = Math.trunc(value)
    document.getElementById('landmark').value = String(((seat % 4) + 4) % 4)
    document.getElementById('place-label').textContent = `${views[0].map.landmark(seat).label} · same chunk, two perspectives`
    for (const v of views) { const c = v.map.chunkCenter(seat); v.map.ensure(seat - 1, seat + 1); v.stage.focus(c.x, c.z, { span: CHUNK_W }) }
  }
  function setFlip(value) {
    flipped = !!value; views[1].stage.setFlip(flipped)
    document.getElementById('flip').setAttribute('aria-pressed', String(flipped))
    document.getElementById('north-label').textContent = flipped ? 'Looking south' : 'Looking north'
  }
  function resize() {
    for (const v of views) { const w = v.host.clientWidth, h = v.host.clientHeight; v.stage.resize(w, h); v.fx.resize(w, h) }
    render()
  }
  function tick(now) {
    if (disposed) return
    const dt = Math.min(.1, (now - last) / 1000); last = now
    if (!paused) { time += dt; render(dt) }
    frame = requestAnimationFrame(tick)
  }
  const observer = new ResizeObserver(resize)
  for (const v of views) observer.observe(v.host)
  function dispose() {
    if (disposed) return
    disposed = true; cancelAnimationFrame(frame); observer.disconnect()
    for (const v of views) { v.fx.dispose(); v.cast.forEach(p => p.dispose()); v.map.dispose(); v.stage.dispose() }
  }
  document.getElementById('flip').addEventListener('click', () => setFlip(!flipped))
  document.getElementById('landmark').addEventListener('change', event => setSeat(Number(event.target.value)))
  window.flipPreview = { views, render, setFlip, setSeat, pause() { paused = true }, play() { paused = false; last = performance.now() }, step(dt = 1 / 60) { time += dt; render(dt) }, setTime(t) { time = t; render() }, dispose }
  setSeat(seat); for (const v of views) for (let i = 0; i < 24; i++) v.stage.update(.25)
  resize(); addEventListener('pagehide', dispose, { once: true }); frame = requestAnimationFrame(tick)
