<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede9e3">
  <title>petpack — a little world, together</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='%230a84ff'/%3E%3Ccircle cx='14' cy='17' r='4' fill='white'/%3E%3Ccircle cx='26' cy='17' r='4' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./desk.css">

<body>
  <main class="table" aria-label="Three neighbouring laptops sharing one petpack world"></main>
  <template id="laptop-template">
    <section class="laptop">
      <div class="lid">
        <div class="camera-notch" aria-hidden="true"><i></i></div>
        <div class="desktop">
          <div class="wallpaper" aria-hidden="true"></div>
          <div class="menu-bar" aria-hidden="true">
            <svg viewBox="0 0 18 20" class="apple"><path d="M12.5 0c.2 2-1.2 3.4-2.8 3.4C9.5 1.7 11 .2 12.5 0ZM15.8 14.3c-.5 1.3-2 4.2-3.7 4.2-1 0-1.4-.6-2.7-.6s-1.8.6-2.7.6c-1.6 0-3.1-2.6-3.9-4.6C1.5 10.8 2 7 4.7 5.6c1.4-.7 2.7-.1 3.7.2.6.2 1 .2 1.6 0 1.5-.6 3.4-1.1 5.3.7-2.6 1.5-2.9 5.6.5 7.8Z"/></svg>
            <span class="menu-dashes"><i></i><i></i><i></i></span>
            <span class="menu-right"><svg viewBox="0 0 24 18"><path d="M2 5Q12-3 22 5M5 9q7-6 14 0M9 13q3-2 6 0"/><circle cx="12" cy="16" r=".6"/></svg><i class="battery"></i><span class="clock">10:09</span></span>
          </div>
          <div class="world-viewport"><canvas aria-label="Pets exploring a floating island"></canvas></div>
          <div class="dock" aria-hidden="true"><i class="dock-finder"></i><i class="dock-terminal"></i><i class="dock-safari"></i><i class="dock-notes"></i><b></b><i class="dock-pet"></i></div>
        </div>
      </div>
      <div class="hinge" aria-hidden="true"></div>
      <div class="base" aria-hidden="true"><div class="thumb"></div></div>
      <div class="laptop-shadow" aria-hidden="true"></div>
    </section>
  </template>
  <script type="module" src="./demo.js"></script>
</body>
</html>
