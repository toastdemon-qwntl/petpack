<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,"><title>petpack · bubble motion</title>
  <script type="importmap">{ "imports": {
    "three": "../../../node_modules/three/build/three.module.js",
    "three/addons/": "../../../node_modules/three/examples/jsm/" } }</script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#dbe3de;font:14px/1.6 system-ui;color:#476057}
    main{position:absolute;top:10%;left:8%}h1{font:32px Georgia;margin-bottom:8px}p{margin:0}
    .glass{position:absolute;right:0;top:24vh;padding:9px 0 9px 9px;border:1px solid #ffffffc0;border-right:0;
      border-radius:22px 0 0 22px;background:#ffffff55;backdrop-filter:blur(24px) saturate(1.3);
      box-shadow:inset 0 1px #fff,0 20px 44px #3a54432b}
    .pane{position:relative;width:520px;height:340px;border-radius:14px 0 0 14px;overflow:hidden}
    .world,.overlay{position:absolute;inset:0;width:100%;height:100%}.world{display:block;image-rendering:pixelated}
  </style>
</head>
<body><main><h1>A thought, carried along.</h1><p>The same pixel pet, the same village, one steady voice.</p></main>
<div class="glass"><div class="pane"><canvas class="world"></canvas><div class="overlay"></div></div></div>
<script type="module">
import * as THREE from 'three'
import { createStage } from './stage.js'
import { createMap } from './map.js'
import { createPixelPet } from './pixel-pet.js'
import { createFx } from './fx.js'

const params = new URLSearchParams(location.search)
const pixelScale = Number(params.get('px')) === 3 ? 3 : 2
const pane = document.querySelector('.pane'), canvas = document.querySelector('.world'), overlay = document.querySelector('.overlay')
if (pixelScale === 3) Object.assign(pane.style, { width:'780px', height:'510px' })
const stage = createStage(canvas, { pixelScale, timeOfDay:14 })
const map = createMap(stage.scene)
map.ensure(-1, 1)
const fx = createFx({ scene:stage.scene, camera:stage.camera, overlay, stage })
const pets = new Map()
function add(id, x, z, color, kind) {
  const character = createPixelPet({ color, kind }), anchor = new THREE.Group()
  anchor.add(character.object3d); anchor.position.set(x, map.ground(x,z), z); stage.scene.add(anchor)
  fx.attach(id, { anchor, height:character.height, name:id, color })
  const pet = { character, anchor }; pets.set(id, pet); return pet
}
const walker = add('Pip', -4.5, 1.5, '#71b6db', 'cat')
add('Cleo', 3.8, 2.3, '#e89583', 'fox')
function resize(w = pane.clientWidth, h = pane.clientHeight) {
  Object.assign(pane.style, { width:`${w}px`, height:`${h}px` })
  stage.resize(w,h); fx.resize(w,h); stage.focus(0,-1.25,{span:14})
}
resize()
for (let i=0;i<40;i++) stage.update(.25)
let time = 0, paused = params.has('paused'), disposed = false, raf = 0, last = performance.now()
let sample = null
function tick(dt, x, z = 1.5) {
  time += dt
  const position = walker.anchor.position
  const nextX = x ?? -4.5 + 9 * (.5 - .5 * Math.cos(time * .55))
  const speed = dt ? Math.hypot(nextX-position.x,z-position.z)/dt : 0
  walker.character.set({anim:speed>.01?'run':'idle',moving:speed,facing:nextX<position.x?-1:1})
  position.set(nextX,map.ground(nextX,z),z)
  for (const pet of pets.values()) pet.character.update(dt,time)
  stage.update(dt,time); map.update(dt,time); stage.scene.updateMatrixWorld(true)
  fx.update(dt,time); stage.render()
  const feet = stage.toScreen(position), head = stage.toScreen(position.clone().add(new THREE.Vector3(0,2.13,0)))
  const bubble = [...overlay.querySelectorAll('.fx-bubble')].find(el=>!el.hidden)
  const name = [...overlay.querySelectorAll('.fx-name')].find(el=>el.getAttribute('aria-label')==='Pip')
  const transform = el => el && !el.hidden ? {x:new DOMMatrix(el.style.transform).m41,y:new DOMMatrix(el.style.transform).m42,w:el.width*pixelScale,h:el.height*pixelScale} : null
  sample = {time, feet, head, bubble:transform(bubble), name:transform(name), text:bubble?.getAttribute('aria-label'),
    bubbleCount:overlay.querySelectorAll('.fx-bubble:not([hidden]),.fx-gift-label:not([hidden])').length}
  return sample
}
fx.setStatus('Pip','working')
tick(0,-4.5)
function loop(now) {
  const dt = Math.min(.1,(now-last)/1000);last=now
  if (!paused) tick(dt)
  raf=requestAnimationFrame(loop)
}
raf=requestAnimationFrame(loop)
window.bubblesDemo = {stage,map,fx,pets,walker,overlay,resize,tick,
  get sample(){return sample}, pause(value=true){paused=value},
  say(text='Can you help with this skill?'){fx.say('Pip',text)},
  ask(){return fx.ask('Pip','Cleo',{question:'How do we ship?',answer:'Use my deploy skill.',kind:'skill'})},
  dispose(){if(disposed)return;disposed=true;cancelAnimationFrame(raf);fx.dispose();for(const pet of pets.values())pet.character.dispose();map.dispose();stage.dispose()},
}
window.addEventListener('pagehide',()=>window.bubblesDemo.dispose(),{once:true})
</script></body></html>
